<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 302" width="800" height="302" role="img" aria-labelledby="t d">
  <title id="t">Meu ecossistema</title><desc id="d">Git e GitHub, Supabase, Vercel, Automações e IA</desc>
  <style>.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade 1.2s ease-out both}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes fade{from{opacity:0}}.d1{animation-delay:.05s}.d2{animation-delay:.25s}.d3{animation-delay:.45s}.d4{animation-delay:.65s}.d5{animation-delay:.85s}.d6{animation-delay:1.05s}.d7{animation-delay:1.25s}.wave{transform-box:fill-box;transform-origin:70% 85%;animation:wave 2.2s ease-in-out .9s 2}@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}.node{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.3)}}.flow{stroke-dasharray:6 9;animation:flow 7s linear infinite}@keyframes flow{to{stroke-dashoffset:-150}}.drift{animation:drift 16s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(-70px,34px)}}.blink{animation:blink 1s step-end 12}@keyframes blink{50%{opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.8);opacity:0}}.halo{animation:halo 4s ease-in-out infinite}@keyframes halo{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.up,.fade,.wave,.node,.flow,.drift,.blink,.ring,.halo{animation:none!important}.ring{opacity:0}}</style>
