<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="t d"><title id="t">Problemas reais merecem soluções que funcionam na segunda-feira de manhã.</title><desc id="d">Johnny de Sá  ·  github.com/john065</desc><style>.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade 1.2s ease-out both}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes fade{from{opacity:0}}.d1{animation-delay:.05s}.d2{animation-delay:.25s}.d3{animation-delay:.45s}.d4{animation-delay:.65s}.d5{animation-delay:.85s}.d6{animation-delay:1.05s}.d7{animation-delay:1.25s}.wave{transform-box:fill-box;transform-origin:70% 85%;animation:wave 2.2s ease-in-out .9s 2}@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}.node{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.3)}}.flow{stroke-dasharray:6 9;animation:flow 7s linear infinite}@keyframes flow{to{stroke-dashoffset:-150}}.drift{animation:drift 16s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(-70px,34px)}}.blink{animation:blink 1s step-end 12}@keyframes blink{50%{opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.8);opacity:0}}.halo{animation:halo 4s ease-in-out infinite}@keyframes halo{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.up,.fade,.wave,.node,.flow,.drift,.blink,.ring,.halo{animation:none!important}.ring{opacity:0}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="0.55" stop-color="#111833"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><radialGradient id="g1" cx="0.88" cy="0.12" r="0.65"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.38"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="0.05" cy="1" r="0.55"><stop offset="0" stop-color="#2563EB" stop-opacity="0.22"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern><clipPath id="frame"><rect width="1000" height="230" rx="20"/></clipPath><linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="620" y2="0"><stop offset="0" stop-color="#60A5FA"/><stop offset="0.42" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#E0E7FF"/><stop offset="0.58" stop-color="#A78BFA"/><stop offset="1" stop-color="#60A5FA"/><animateTransform attributeName="gradientTransform" type="translate" values="-240 0;240 0" dur="4s" repeatCount="indefinite"/></linearGradient></defs><g clip-path="url(#frame)"><rect width="1000" height="230" fill="url(#bg)"/><rect width="1000" height="230" fill="url(#grid)"/><rect class="drift" x="-100" y="-100" width="1200" height="430" fill="url(#g1)"/><rect width="1000" height="230" fill="url(#g2)"/></g><rect x="0.75" y="0.75" width="998.5" height="228.5" rx="19.5" fill="none" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="1.5"/><g font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle"><rect x="380" y="44" width="240" height="3" rx="1.5" fill="url(#shine)"/><text x="500" y="104" fill="#F8FAFC" font-size="32" font-weight="700">Problemas reais merecem soluções</text><text x="500" y="146" fill="#F8FAFC" font-size="32" font-weight="700">que funcionam na segunda-feira de manhã.</text><text x="500" y="192" fill="#94A3B8" font-size="18" letter-spacing="1">Johnny de Sá  ·  github.com/john065</text></g></svg>