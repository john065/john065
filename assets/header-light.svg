<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
  <title id="t">Olá, eu sou o Johnny</title>
  <desc id="d">Empreendedor • IA &amp; Automações • Desenvolvimento de Produtos. Transformando desafios reais de negócios em soluções tecnológicas.</desc>
  <style>
    .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
    .fade{animation:fade 1.2s ease-out both}
    @keyframes up{from{opacity:0;transform:translateY(14px)}}
    @keyframes fade{from{opacity:0}}
    .d1{animation-delay:.05s}.d2{animation-delay:.25s}.d3{animation-delay:.45s}
    .d4{animation-delay:.65s}.d5{animation-delay:.85s}.d6{animation-delay:1.05s}.d7{animation-delay:1.25s}
    .wave{transform-box:fill-box;transform-origin:70% 85%;animation:wave 2.2s ease-in-out .9s 2}
    @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
    .node{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.3)}}
    .flow{stroke-dasharray:6 9;animation:flow 7s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-150}}
    .drift{animation:drift 16s ease-in-out infinite alternate}
    @keyframes drift{to{transform:translate(-70px,34px)}}
    .blink{animation:blink 1s step-end 12}
    @keyframes blink{50%{opacity:0}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.8);opacity:0}}
    .halo{animation:halo 4s ease-in-out infinite}
    @keyframes halo{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){
      .up,.fade,.wave,.node,.flow,.drift,.blink,.ring,.halo{animation:none!important}
      .ring{opacity:0}
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#F6F7FF"/><stop offset="1" stop-color="#EDE9FE"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <radialGradient id="g1" cx="0.88" cy="0.12" r="0.65"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.16"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.55"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.10"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1E1B4B" stroke-opacity="0.045"/></pattern>
    <clipPath id="frame"><rect width="1000" height="380" rx="20"/></clipPath>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="640" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="0.42" stop-color="#7C3AED"/><stop offset="0.5" stop-color="#A5B4FC"/><stop offset="0.58" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/><animateTransform attributeName="gradientTransform" type="translate" values="-240 0;240 0" dur="6s" repeatCount="indefinite"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)"><rect width="1000" height="380" fill="url(#bg)"/><rect width="1000" height="380" fill="url(#grid)"/><rect class="drift" x="-100" y="-100" width="1200" height="580" fill="url(#g1)"/><rect width="1000" height="380" fill="url(#g2)"/></g>
  <rect x="0.75" y="0.75" width="998.5" height="378.5" rx="19.5" fill="none" stroke="#7C3AED" stroke-opacity="0.22" stroke-width="1.5"/>
  <g class="fade d2"><path class="flow" d="M835 92 L905 62 L955 122 L915 178 L848 165 Z M905 62 L915 178 M835 92 L955 122" fill="none" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.6"/><circle class="node" style="animation-delay:0s" cx="835" cy="92" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><circle class="node" style="animation-delay:0.6s" cx="905" cy="62" r="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><circle class="node" style="animation-delay:1.2s" cx="955" cy="122" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><circle class="node" style="animation-delay:1.8s" cx="915" cy="178" r="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><circle class="node" style="animation-delay:2.4s" cx="848" cy="165" r="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/></g>
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g class="up d1"><rect x="64" y="56" width="284" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.6" stroke="url(#ac)" stroke-width="1.5"/><circle cx="86" cy="74" r="5" fill="url(#ac)"/><circle class="ring" cx="86" cy="74" r="5" fill="none" stroke="#7C3AED" stroke-width="1.5"/><text x="102" y="79.5" fill="#334155" font-size="15" font-weight="700" letter-spacing="3">BUILDING THE FUTURE</text></g>
    <text class="up d2" x="60" y="176" fill="#0F172A" font-size="66" font-weight="700" textLength="640" lengthAdjust="spacing">Olá, eu sou o <tspan fill="url(#shine)">Johnny</tspan></text>
    <g class="up d2"><text class="wave" x="720" y="172" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif" font-size="56">👋</text></g>
    <rect class="up d3" x="64" y="204" width="96" height="5" rx="2.5" fill="url(#ac)"/>
    <text class="up d4" x="64" y="262" fill="#334155" font-size="27" font-weight="600">Empreendedor  •  IA &amp; Automações  •  Desenvolvimento de Produtos</text>
    <clipPath id="typing"><rect x="60" y="280" width="748" height="44"><animate attributeName="width" values="0;0;748" keyTimes="0;0.4;1" dur="3.6s" fill="freeze"/></rect></clipPath>
    <text clip-path="url(#typing)" x="64" y="312" fill="#64748B" font-size="24" textLength="740" lengthAdjust="spacing">Transformando desafios reais de negócios em soluções tecnológicas.</text>
    <rect class="blink" x="810" y="292" width="3" height="26" rx="1.5" fill="url(#ac)"><animate attributeName="x" values="62;62;810" keyTimes="0;0.4;1" dur="3.6s" fill="freeze"/></rect>
  </g>
</svg>
